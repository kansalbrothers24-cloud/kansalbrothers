<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANSAL BROTHERS - Mobile Accessories & Service Center</title>
    <!-- Google Fonts & FontAwesome for Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-metallic: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 50%, #cccccc 100%);
            --card-bg: #ffffff;
            --text-color: #000000;
            --gold-accent: #d4af37;
            --gold-light: #f3e5ab;
            --shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-metallic);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Sticky Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--gold-accent);
        }

        .logo-area span {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold-accent);
        }

        .nav-cta {
            background: var(--gold-accent);
            color: #000 !important;
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        /* Hero Section */
        header.hero {
            padding: 160px 5% 80px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            min-height: 100vh;
        }

        .hero-content {
            flex: 1;
        }

        .hero-badge {
            background: var(--gold-light);
            border: 1px solid var(--gold-accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }

        .hero-content h1 {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-content p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid var(--gold-accent);
        }

        .btn-primary {
            background: var(--gold-accent);
            color: #000;
        }

        .btn-primary:hover {
            background: #bfa130;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212,175,55,0.4);
        }

        .btn-secondary {
            background: #fff;
            color: #000;
        }

        .btn-secondary:hover {
            background: #f0f0f0;
            transform: translateY(-3px);
        }

        .hero-image {
            flex: 1;
            position: relative;
            text-align: center;
        }

        .hero-image img {
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            border: 4px solid var(--gold-accent);
            box-shadow: var(--shadow);
            transition: transform 0.5s;
        }

        .hero-image img:hover {
            transform: scale(1.02);
        }

        /* Floating Stickers */
        .sticker {
            position: absolute;
            background: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid var(--gold-accent);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Sections General */
        section {
            padding: 80px 5%;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .section-subtitle {
            text-align: center;
            font-size: 1rem;
            margin-bottom: 50px;
            opacity: 0.8;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

            background: var(--card
